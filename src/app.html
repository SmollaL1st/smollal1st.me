<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />

		<!-- Google Fonts: Space Grotesk & Space Mono -->
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap"
			rel="stylesheet"
		/>

		<link rel="me" href="https://mastodon.social/@SmollaL1st" />

		<!-- Prevent theme flash & set system theme + restore dynamic M3 palette / favicon instantly before paint -->
		<script>
			try {
				const isDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
				document.documentElement.setAttribute('data-theme', isDark ? 'dark' : 'light');

				const cachedCss = localStorage.getItem('dynamic-m3-css');
				if (cachedCss) {
					const style = document.createElement('style');
					style.id = 'dynamic-m3-palette';
					style.textContent = cachedCss;
					document.head.appendChild(style);
				}

				const cachedFavicon = localStorage.getItem('dynamic-m3-favicon');
				if (cachedFavicon) {
					const link = document.querySelector("link[rel*='icon']");
					if (link) link.href = cachedFavicon;
				}
			} catch (_) {}
		</script>

		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
